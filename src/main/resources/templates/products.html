
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout1}">

<head>
    <meta charset="UTF-8">
    <title>Products</title>
</head>

<body>

<section layout:fragment="content1">

    <div class="p-3">

        <!-- Ajouter un produit : ADMIN uniquement -->
        <a class="btn btn-primary mb-3"
           sec:authorize="hasRole('ADMIN')"
           th:href="@{/admin/newProducts}">
            New Product
        </a>

        <!-- Tableau des produits : USER et ADMIN -->
        <table class="table">

            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Quantity</th>

                <!-- Action visible uniquement pour ADMIN -->
                <th sec:authorize="hasRole('ADMIN')"></th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="p : ${productsList}">

                <td th:text="${p.id}"></td>

                <td th:text="${p.name}"></td>

                <td th:text="${p.price}"></td>

                <td th:text="${p.quantity}"></td>

                <!-- Supprimer un produit : ADMIN uniquement -->
                <td sec:authorize="hasRole('ADMIN')">
                    <form method="post"
                          th:action="@{/admin/delete(id=${p.id})}">
                        <button type="submit" class="btn btn-danger">
                            Delete
                        </button>
                    </form>
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</section>

</body>
</html>
